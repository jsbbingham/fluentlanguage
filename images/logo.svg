<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 48">
  <!-- Icon: f + book + speech bubble -->
  <g transform="translate(2, 0)">
    <!-- Open book shape -->
    <path d="M16 6 L16 38 Q24 42 32 38 L32 6 Q24 10 16 6Z" fill="#E8D5C8"/>
    <path d="M32 6 L32 38 Q40 42 48 38 L48 6 Q40 10 32 6Z" fill="#C17F59" opacity="0.25"/>
    <path d="M32 6 L32 38" stroke="#C17F59" stroke-width="1"/>
    <!-- Book text lines -->
    <line x1="35" y1="14" x2="44" y2="12" stroke="#C17F59" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <line x1="35" y1="20" x2="44" y2="18" stroke="#C17F59" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <line x1="35" y1="26" x2="42" y2="24" stroke="#C17F59" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <!-- Stylized "f" letter overlaid -->
    <text x="18" y="36" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#C17F59" font-style="italic">f</text>
    <!-- Speech bubble -->
    <ellipse cx="40" cy="10" rx="8" ry="6" fill="#9E6A47"/>
    <path d="M35 14 L33 19 L38 14" fill="#9E6A47"/>
    <!-- Dots in speech bubble (conversation) -->
    <circle cx="37" cy="10" r="1.2" fill="#FEFCF9"/>
    <circle cx="40.5" cy="10" r="1.2" fill="#FEFCF9"/>
    <circle cx="44" cy="10" r="1.2" fill="#FEFCF9"/>
  </g>
  <!-- Text: FLUENT LANGUAGE -->
  <text x="60" y="24" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#2D2A26" letter-spacing="1.5">FLUENT</text>
  <text x="60" y="42" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#C17F59" letter-spacing="3">LANGUAGE</text>
</svg>
